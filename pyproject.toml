[project]
name = "trafficflowiq"
version = "1.0.0"
description = "Freeway congestion and queue prediction system"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4", "lightgbm>=4.3", "pyarrow>=15", "joblib>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "backend"]
testpaths = ["tests", "backend/tests"]
